name: Site

# The documentation site (web/docs) and the playground (web/playground), on
# GitHub Pages, in two versions: at the root, those of the latest stable
# release; under /next/, those of main, for the next release. A release
# candidate is the next release by nature, and is not served on its own.
# Until a stable release holds the site (1.0.0), main is served at the root
# alone. A pull
# request builds its own tree to check it; a push to main, a published
# release, or a manual run deploys both versions.
#
# The site is served at the root of its own domain,
# greek-conversion.humanites.fr (SITE in web/docs/astro.config.mjs). The
# domain is set in the repository's Pages settings, not here: a deployment
# by workflow ignores a CNAME file. Its DNS record is a CNAME to
# defense-humanites.github.io.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - package.json
      - package-lock.json
      - scripts/build_site.ts
      - src/**
      - tsconfig*.json
      - web/**
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - scripts/build_site.ts
      - src/**
      - web/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      # main, whatever triggered the run, except a pull request's own tree;
      # with the tags and their history, to build the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/docs/package-lock.json
      - name: Find the release to serve at the root
        id: release
        if: github.event_name != 'pull_request'
        run: |
          # The newest stable version (no pre-release suffix) that holds the
          # site. The 0.x tags belong to the legacy branch, which has no site:
          # they are left out, even if one is set on a commit of main by
          # mistake, as v0.14.5 once was.
          tag=""
          for candidate in $(git tag --list 'v[1-9]*' --sort=-v:refname); do
            case "$candidate" in *-*) continue ;; esac
            if git cat-file -e "$candidate:web/docs/package.json" 2>/dev/null; then
              tag="$candidate"
              break
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build this tree (main, as the next release, beside a release)
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            export DOCS_CHANNEL=next DOCS_RELEASE="${TAG#v}"
          fi
          npm ci --ignore-scripts
          npm ci --prefix web/docs
          npm run build --prefix web/docs
          npm run site:build
          cp -R web/docs/dist/. _site/
      - name: Build the release at the root, and this tree under /next/
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mv _site "$RUNNER_TEMP/next"
          git worktree add "$RUNNER_TEMP/release" "$TAG"
          cd "$RUNNER_TEMP/release"
          npm ci --ignore-scripts
          npm ci --prefix web/docs
          DOCS_RELEASE="${TAG#v}" DOCS_NEXT=1 npm run build --prefix web/docs
          npm run site:build
          cp -R web/docs/dist/. _site/
          mv _site "$GITHUB_WORKSPACE/_site"
          mv "$RUNNER_TEMP/next" "$GITHUB_WORKSPACE/_site/next"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
