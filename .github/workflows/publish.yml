name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PUBLISH_ENABLED == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Resolve release metadata
        id: release
        run: node scripts/release_metadata.ts "${{ github.event.release.tag_name }}"
      - run: npm run check
      - run: npm test
      - run: npm run jsr:check
      - run: npm run npm:check
      - name: Publish to JSR
        # Authenticated by the workflow's OIDC token, with provenance.
        run: npx jsr publish
      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1
      - name: Publish to npm
        run: >-
          npm publish ./npm
          --tag "${{ steps.release.outputs.npm_tag }}"
          --access public
          --provenance
