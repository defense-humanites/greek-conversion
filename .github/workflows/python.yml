name: Python

# The Python package (python/): the library's bundle run in an embedded
# JavaScript engine. The wheel is built and installed as users install it,
# its tests run on both engines, its outputs are compared with the
# library's in Node over the inputs of the differential test, and the
# examples of its documentation run. It is published
# by publish.yml, after JSR and npm.
#
# It runs when the package, the library, or the documentation that the
# Python pages are made from changes, and every Monday, or by hand. A pull
# request compares one case in ten with Node; a push to main, the weekly
# run, and a manual one compare them all.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/python.yml
      - LICENSE
      - docs/**
      - package.json
      - package-lock.json
      - python/**
      - src/**
      - tests/differential.ts
      - tests/differential_inputs.ts
      - web/docs/scripts/**
      - web/docs/src/content/docs/**
      - web/docs/src/documentations.ts
  pull_request:
    paths:
      - .github/workflows/python.yml
      - LICENSE
      - docs/**
      - package.json
      - package-lock.json
      - python/**
      - src/**
      - tests/differential.ts
      - tests/differential_inputs.ts
      - web/docs/scripts/**
      - web/docs/src/content/docs/**
      - web/docs/src/documentations.ts
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python the package supports, and the latest, where
          # the outputs are also compared with Node's.
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14", differential: true }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: node python/scripts/build_bundle.mjs
      - run: python -m pip install --upgrade pip build
      - run: python -m build python
      - name: Install the wheel, as users do
        run: |
          wheel="$(ls python/dist/*.whl)"
          python -m pip install "$wheel[v8]"
          python -m pip install --group python/pyproject.toml:test
      - run: ruff check python
      - run: mypy python/src/greek_conversion
      - name: Test the installed wheel
        # From outside the repository, so that the wheel is what is imported.
        run: cd "$RUNNER_TEMP" && python -m pytest "$GITHUB_WORKSPACE/python/tests"
      - name: Check the Python documentation
        if: matrix.differential
        run: |
          node web/docs/scripts/sync_python.ts
          python python/scripts/check_docs.py
          python python/scripts/api_reference.py --check
      - name: Compare with the library in Node
        if: matrix.differential
        env:
          # One case in ten for a pull request: about 21,000 comparisons on
          # each engine, instead of 214,000.
          EVERY: ${{ github.event_name == 'pull_request' && '10' || '1' }}
        run: |
          node python/scripts/differential_dump.ts > "$RUNNER_TEMP/expected.jsonl"
          python python/scripts/differential.py "$RUNNER_TEMP/expected.jsonl" --engine quickjs --every "$EVERY"
          python python/scripts/differential.py "$RUNNER_TEMP/expected.jsonl" --engine v8 --every "$EVERY"
