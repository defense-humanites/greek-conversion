# Keeps the SHA-pinned GitHub Actions and the exactly pinned development
# dependencies current. Each update arrives as a pull request that CI
# validates before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      development:
        dependency-type: development
    ignore:
      # TypeDoc, which lints the API documentation, accepts TypeScript up to
      # 6.0; move to a new major together with it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Node.js types follow the oldest version of the engines field.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
