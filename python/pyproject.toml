[build-system]
# 77: `license` as an SPDX expression, and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-conversion"
dynamic = ["version"]
description = "Convert Ancient, Byzantine, and Modern Greek between Greek script, Beta Code, and Latin script, with atomic options composed into standards-based presets, and information-loss diagnostics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antoine Boquet" }]
requires-python = ">=3.11"
keywords = ["greek", "ancient greek", "polytonic", "beta code", "transliteration", "romanization", "digital humanities", "classics", "TLG"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: Greek",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
# QuickJS by default (quickjs-ng, the maintained fork of QuickJS): small
# abi3 wheels, a low cost per call. Its binding is a 0.x release: below 1, so
# that a breaking release does not reach users unchecked. V8 on request, for
# long texts and large batches; when installed, it is preferred.
dependencies = ["quickjs-ng>=0.18,<1"]

[project.optional-dependencies]
# 0.12.2: the first with `MiniRacer.close()`.
v8 = ["mini-racer>=0.12.2"]

[dependency-groups]
# ruff within a minor release: its default rules change between them.
test = ["pytest>=8", "ruff>=0.17,<0.18", "mypy>=1.13", "typing_extensions>=4.12"]

[project.urls]
Homepage = "https://greek-conversion.humanites.fr/"
Documentation = "https://greek-conversion.humanites.fr/"
Source = "https://github.com/defense-humanites/greek-conversion"
Issues = "https://github.com/defense-humanites/greek-conversion/issues"
Changelog = "https://github.com/defense-humanites/greek-conversion/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "greek_conversion._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greek_conversion = ["_bundle/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.ruff]
target-version = "py311"
